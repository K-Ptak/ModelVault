# Cotygodniowe propozycje aktualizacji zależności – jako pull requesty do gałęzi dev.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      electron:
        patterns: [electron, electron-builder, electron-updater]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
